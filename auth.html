<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listikus – Konto</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E5B44">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @font-face{font-family:'Inter';font-style:normal;font-display:swap;font-weight:100 900;src:url('fonts/inter-variable.woff2') format('woff2')}
  @font-face{font-family:'Bricolage Grotesque';font-style:normal;font-display:swap;font-weight:200 800;src:url('fonts/bricolage-grotesque-variable.woff2') format('woff2')}
  :root{
    --green:#1E5B44; --green-dark:#164A36; --green-deep:#0F3325;
    --mint:#E9F0EA; --cream:#FBFAF6;
    --ink:#1B211D; --muted:#4E5A53; --line:#E6E5DC; --red:#C62828;
    --shadow:0 22px 60px -22px rgba(15,51,37,.45);
    --disp:"Bricolage Grotesque",system-ui,sans-serif;
    --body:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; overflow-x:clip}
  html,body{min-height:100%}
  body{margin:0; font-family:var(--body); color:var(--ink); background:var(--cream);
       line-height:1.6; -webkit-font-smoothing:antialiased;
       min-height:100vh; display:flex; flex-direction:column}
  img,svg{max-width:100%}
  h1{font-family:var(--disp); font-weight:700; letter-spacing:-.02em; line-height:1.12; margin:0; font-size:clamp(23px,4.4vw,28px)}

  /* Kopf – wie auf der Startseite */
  header{background:var(--cream); border-bottom:1px solid var(--line)}
  .wrap{max-width:1120px; margin:0 auto; padding:0 22px}
  .bar{display:flex; align-items:center; height:64px}
  .brand{display:inline-flex; align-items:center; gap:11px; font-family:var(--disp);
         font-weight:800; font-size:20px; color:var(--ink); text-decoration:none}
  .brand .mk{width:32px; height:32px; border-radius:11px; background:var(--green);
             display:grid; place-items:center; box-shadow:0 5px 12px -4px rgba(30,91,68,.7); flex:none}
  .brand .mk svg{width:18px; height:18px; color:#fff}

  /* Markenfläche mit der Karte darauf */
  main{flex:1 0 auto; position:relative; display:flex; align-items:center;
       justify-content:center; padding:44px 22px 56px; overflow:hidden}
  .bg{position:absolute; inset:0; z-index:0}
  .bg::before{content:""; position:absolute; inset:0;
    background:
      radial-gradient(70% 60% at 15% 10%, #2C8B61 0%, transparent 55%),
      radial-gradient(60% 60% at 90% 20%, #1A5340 0%, transparent 55%),
      linear-gradient(160deg, #1E5B44 0%, #164A36 60%, #0F3325 100%)}
  .bg::after{content:""; position:absolute; inset:0; opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.10) 1px, transparent 1.4px);
    background-size:22px 22px}

  .card{position:relative; z-index:1; width:100%; max-width:460px; background:#fff;
        border:1px solid rgba(255,255,255,.55); border-radius:26px;
        box-shadow:var(--shadow); padding:36px 32px; text-align:center}
  @media(max-width:420px){.card{padding:28px 20px; border-radius:22px}}

  .ic{width:64px; height:64px; border-radius:50%; background:var(--mint);
      display:grid; place-items:center; margin:0 auto 18px; color:var(--green)}
  .ic svg{width:30px; height:30px}
  .ic.warn{background:#FBEAEA; color:var(--red)}

  .card p{color:var(--muted); font-size:15px; margin:12px 0 0}
  .card p.mail{color:var(--ink); font-weight:600; font-size:15px; word-break:break-all; margin-top:14px}
  .card p.small{font-size:13.5px; margin-top:16px}

  /* Knöpfe */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:9px;
       width:100%; margin-top:22px; padding:14px 22px; border:0; border-radius:14px;
       font-family:var(--disp); font-weight:700; font-size:16px; cursor:pointer;
       text-decoration:none; background:var(--green); color:#fff}
  .btn:hover{background:var(--green-dark)}
  .btn:disabled{opacity:.6; cursor:default}
  .btn svg{width:20px; height:20px}
  .btn.ghost{background:#fff; color:var(--green-dark); border:1.5px solid var(--green); margin-top:12px}
  .btn.ghost:hover{background:var(--mint)}

  /* Formular */
  form{margin-top:22px; text-align:left}
  label{display:block; font-size:13.5px; font-weight:600; margin:0 0 6px}
  .field{position:relative; margin-bottom:14px}
  input{width:100%; font-family:var(--body); font-size:16px; color:var(--ink);
         background:#fff; border:1px solid var(--line); border-radius:12px;
         padding:13px 46px 13px 15px}
  input:focus{outline:0; border-color:var(--green); box-shadow:0 0 0 3px rgba(30,91,68,.14)}
  .peek{position:absolute; right:6px; top:50%; transform:translateY(-50%);
        width:38px; height:38px; border:0; background:none; color:var(--muted);
        border-radius:50%; cursor:pointer; display:grid; place-items:center}
  .peek:hover{background:var(--mint); color:var(--green-dark)}
  .peek svg{width:20px; height:20px}
  .hint{font-size:12.5px; color:var(--muted); margin:0 0 4px}
  .err{color:var(--red); font-size:13.5px; margin:4px 0 0; min-height:1px}

  /* Lade-Ring */
  .spin{width:20px; height:20px; border:2px solid rgba(255,255,255,.45);
        border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite}
  .spin.dark{border-color:rgba(30,91,68,.25); border-top-color:var(--green)}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
  .loading{display:grid; place-items:center; gap:14px; padding:8px 0}
  .loading p{margin:0}

  footer{background:var(--cream); border-top:1px solid var(--line); padding:26px 0; font-size:14px; color:var(--muted)}
  .foot{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap}
  .foot .links{display:flex; gap:20px}
  .foot a{color:var(--muted); text-decoration:none; font-weight:600}
  .foot a:hover{color:var(--ink)}
</style>
</head>
<body>

<!-- Icons als wiederverwendbare Symbole (gleiche Strichstärke wie auf der Startseite) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3.2 6.2 12 13l8.8-6.8"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v6M12 16.6h.01"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 12S5.4 5.5 12 5.5 22.2 12 22.2 12 18.6 18.5 12 18.5 1.8 12 1.8 12z"/><circle cx="12" cy="12" r="3.2"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.6 5.8A9.6 9.6 0 0 1 12 5.5c6.6 0 10.2 6.5 10.2 6.5a17 17 0 0 1-2.9 3.7M6.2 7.6A17 17 0 0 0 1.8 12S5.4 18.5 12 18.5c1.3 0 2.5-.25 3.6-.68"/><path d="M9.9 9.9a3.2 3.2 0 0 0 4.3 4.3"/><line x1="2.6" y1="2.6" x2="21.4" y2="21.4"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.6"/><line x1="10.6" y1="18.4" x2="13.4" y2="18.4"/></symbol>
</svg>

<header>
  <div class="wrap bar">
    <a class="brand" href="index.html"><span class="mk"><svg><use href="#i-cart"/></svg></span>Listikus</a>
  </div>
</header>

<main>
  <div class="bg" aria-hidden="true"></div>
  <div class="card" id="card" role="status" aria-live="polite">
    <div class="loading">
      <div class="spin dark" aria-hidden="true"></div>
      <p>Einen Moment …</p>
    </div>
    <noscript>
      <p>Für diesen Schritt muss JavaScript aktiviert sein. Bitte aktiviere es
         und öffne den Link aus der E-Mail noch einmal.</p>
    </noscript>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <a class="brand" href="index.html"><span class="mk"><svg><use href="#i-cart"/></svg></span>Listikus</a>
    <div class="links">
      <a href="datenschutz.html">Datenschutz</a>
      <a href="impressum.html">Impressum</a>
      <a href="mailto:listikus.einkaufsliste@gmail.com">Kontakt</a>
    </div>
  </div>
</footer>

<script>
(function () {
  "use strict";

  // Öffentlicher Client-Schlüssel des Projekts familienliste-b97a2. Firebase
  // legt ihn per Design offen (er steht auch im Link der E-Mail); die
  // Datenschutzebene sind die Firestore-Regeln, nicht dieser Schlüssel.
  // Bewusst fest verdrahtet statt aus der URL übernommen, damit kein
  // manipulierter Link auf ein fremdes Projekt zeigen kann.
  var API_KEY = "AIzaSyDaI6Goun7wcIwNc_CdJHmq3xhymHy-R-4";

  var ENDPOINT = "https://identitytoolkit.googleapis.com/v1/accounts:";
  var MIN_PW = 6;                       // wie im Registrierungs-Screen der App
  var APP_LINK = "familienliste://open"; // braucht den Intent-Filter in der App

  var params = new URLSearchParams(location.search);
  var mode = params.get("mode") || "";
  var oobCode = params.get("oobCode") || "";
  var card = document.getElementById("card");

  var TITLES = {
    verifyEmail: "E-Mail-Adresse bestätigen",
    verifyAndChangeEmail: "Neue E-Mail-Adresse bestätigen",
    recoverEmail: "E-Mail-Adresse zurücksetzen",
    resetPassword: "Neues Passwort festlegen"
  };
  if (TITLES[mode]) document.title = "Listikus – " + TITLES[mode];

  // ─── Bausteine ──────────────────────────────────────────────────────────
  function icon(id, warn) {
    return '<div class="ic' + (warn ? " warn" : "") + '"><svg><use href="#' +
           id + '"/></svg></div>';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
  }

  /** Knopf zurück in die App – auf dem Handy als Link, sonst als Hinweis. */
  function backToApp() {
    var isAndroid = /Android/i.test(navigator.userAgent);
    if (isAndroid) {
      return '<a class="btn" href="' + APP_LINK + '">' +
             '<svg><use href="#i-open"/></svg>Listikus öffnen</a>';
    }
    return '<p class="small">Du kannst Listikus auf Deinem Handy jetzt wieder ' +
           'öffnen.</p>';
  }

  function showLoading(text) {
    card.innerHTML = '<div class="loading"><div class="spin dark" aria-hidden="true">' +
                     '</div><p>' + esc(text) + '</p></div>';
  }

  function showSuccess(heading, text, extra) {
    card.innerHTML = icon("i-check") + "<h1>" + esc(heading) + "</h1>" +
                     "<p>" + text + "</p>" + (extra || "") + backToApp();
  }

  function showError(heading, text) {
    card.innerHTML = icon("i-alert", true) + "<h1>" + esc(heading) + "</h1>" +
                     "<p>" + text + "</p>" +
                     '<a class="btn ghost" href="index.html">Zu listikus.de</a>';
  }

  // ─── Netz ───────────────────────────────────────────────────────────────
  /** POST an die Identity-Toolkit-API. Wirft ein Error mit dem Google-Code. */
  function post(method, body) {
    return fetch(ENDPOINT + method + "?key=" + encodeURIComponent(API_KEY), {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (json) {
        if (!res.ok) {
          var msg = (json.error && json.error.message) || ("HTTP_" + res.status);
          throw new Error(msg);
        }
        return json;
      });
    });
  }

  /** Google-Fehlercode → deutscher Klartext. */
  function reason(err) {
    var m = String(err && err.message ? err.message : err);
    if (m.indexOf("EXPIRED_OOB_CODE") === 0) {
      return "Dieser Link ist abgelaufen.";
    }
    if (m.indexOf("INVALID_OOB_CODE") === 0 || m.indexOf("MISSING_OOB_CODE") === 0) {
      return "Dieser Link ist nicht mehr gültig – vermutlich wurde er schon " +
             "benutzt oder inzwischen durch einen neueren ersetzt.";
    }
    if (m.indexOf("USER_DISABLED") === 0) {
      return "Dieses Konto ist gesperrt.";
    }
    if (m.indexOf("EMAIL_EXISTS") === 0) {
      return "Diese Adresse wird bereits von einem anderen Konto benutzt.";
    }
    if (m.indexOf("WEAK_PASSWORD") === 0) {
      return "Das Passwort ist zu kurz – bitte mindestens " + MIN_PW +
             " Zeichen verwenden.";
    }
    if (m.indexOf("Failed to fetch") === 0 || m.indexOf("NetworkError") === 0) {
      return "Keine Verbindung. Bitte prüfe Deine Internetverbindung und " +
             "versuche es noch einmal.";
    }
    return "Da ist etwas schiefgelaufen. Bitte fordere den Link in der App " +
           "noch einmal an.";
  }

  // ─── Modus: Adresse bestätigen (Registrierung / Adresswechsel) ──────────
  function runVerify(isChange) {
    showLoading("Wir bestätigen Deine Adresse …");
    post("update", {oobCode: oobCode}).then(function (data) {
      var mail = data.email ? '<p class="mail">' + esc(data.email) + "</p>" : "";
      if (isChange) {
        showSuccess("Adresse geändert",
          "Deine neue E-Mail-Adresse ist bestätigt. Melde Dich in Listikus " +
          "künftig mit ihr an.", mail);
      } else {
        showSuccess("Fertig – Du bist dabei!",
          "Deine E-Mail-Adresse ist bestätigt. Deine Einkaufsliste wartet.", mail);
      }
    }).catch(function (err) {
      showError("Link nicht mehr gültig",
        reason(err) + " Öffne Listikus und lass Dir im Bestätigungs-Bildschirm " +
        "eine neue E-Mail schicken.");
    });
  }

  // ─── Modus: Adressänderung zurücknehmen ─────────────────────────────────
  function runRecover() {
    showLoading("Wir setzen Deine Adresse zurück …");
    post("update", {oobCode: oobCode}).then(function (data) {
      var mail = data.email ? '<p class="mail">' + esc(data.email) + "</p>" : "";
      showSuccess("Adresse zurückgesetzt",
        "Dein Konto gehört wieder zu Deiner alten E-Mail-Adresse.", mail +
        '<p class="small">Wenn Du diese Änderung nicht selbst angestoßen hast, ' +
        'setze zur Sicherheit Dein Passwort neu – in Listikus über ' +
        '„Passwort vergessen?“ auf dem Anmelde-Bildschirm.</p>');
    }).catch(function (err) {
      showError("Link nicht mehr gültig", reason(err));
    });
  }

  // ─── Modus: Neues Passwort setzen ───────────────────────────────────────
  function runReset() {
    showLoading("Wir prüfen Deinen Link …");
    // Erst den Code prüfen (verbraucht ihn nicht) – so sieht der Nutzer einen
    // abgelaufenen Link, bevor er ein Passwort eintippt.
    post("resetPassword", {oobCode: oobCode}).then(function (data) {
      showResetForm(data.email || "");
    }).catch(function (err) {
      showError("Link nicht mehr gültig",
        reason(err) + " Fordere in Listikus über „Passwort vergessen?“" +
        " einen neuen Link an.");
    });
  }

  function showResetForm(email) {
    card.innerHTML = icon("i-lock") +
      "<h1>Neues Passwort</h1>" +
      "<p>Lege ein neues Passwort für Dein Listikus-Konto fest.</p>" +
      (email ? '<p class="mail">' + esc(email) + "</p>" : "") +
      '<form id="pwform" novalidate>' +
        '<label for="pw1">Neues Passwort</label>' +
        '<p class="hint">Mindestens ' + MIN_PW + " Zeichen</p>" +
        '<div class="field">' +
          '<input id="pw1" type="password" autocomplete="new-password" ' +
                 'autocapitalize="off" spellcheck="false" maxlength="100">' +
          '<button class="peek" type="button" id="peek" ' +
                  'aria-label="Passwort anzeigen">' +
            '<svg><use href="#i-eye"/></svg></button>' +
        "</div>" +
        '<label for="pw2">Passwort wiederholen</label>' +
        '<div class="field">' +
          '<input id="pw2" type="password" autocomplete="new-password" ' +
                 'autocapitalize="off" spellcheck="false" maxlength="100">' +
        "</div>" +
        '<p class="err" id="pwerr" role="alert"></p>' +
        '<button class="btn" type="submit" id="save">Passwort speichern</button>' +
      "</form>";

    var form = document.getElementById("pwform");
    var pw1 = document.getElementById("pw1");
    var pw2 = document.getElementById("pw2");
    var errBox = document.getElementById("pwerr");
    var save = document.getElementById("save");
    var peek = document.getElementById("peek");

    peek.addEventListener("click", function () {
      var show = pw1.type === "password";
      pw1.type = pw2.type = show ? "text" : "password";
      peek.setAttribute("aria-label", show ? "Passwort verbergen" : "Passwort anzeigen");
      peek.innerHTML = '<svg><use href="#i-eye' + (show ? "-off" : "") + '"/></svg>';
    });

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      errBox.textContent = "";

      if (pw1.value.length < MIN_PW) {
        errBox.textContent = "Bitte mindestens " + MIN_PW + " Zeichen verwenden.";
        pw1.focus();
        return;
      }
      if (pw1.value !== pw2.value) {
        errBox.textContent = "Die beiden Passwörter sind nicht gleich.";
        pw2.focus();
        return;
      }

      save.disabled = true;
      save.innerHTML = '<span class="spin" aria-hidden="true"></span>Speichern …';

      post("resetPassword", {oobCode: oobCode, newPassword: pw1.value})
        .then(function (data) {
          var mail = data.email ? '<p class="mail">' + esc(data.email) + "</p>" : "";
          showSuccess("Passwort geändert",
            "Melde Dich in Listikus mit Deinem neuen Passwort an.", mail);
        })
        .catch(function (err) {
          save.disabled = false;
          save.textContent = "Passwort speichern";
          errBox.textContent = reason(err);
        });
    });

    pw1.focus();
  }

  // ─── Weiche ─────────────────────────────────────────────────────────────
  if (!oobCode || !TITLES[mode]) {
    showError("Link unvollständig",
      "Dieser Link lässt sich nicht zuordnen. Bitte tippe den Link in der " +
      "E-Mail direkt an, statt ihn abzuschreiben – oder fordere in Listikus " +
      "einen neuen an.");
  } else if (mode === "resetPassword") {
    runReset();
  } else if (mode === "recoverEmail") {
    runRecover();
  } else {
    runVerify(mode === "verifyAndChangeEmail");
  }
})();
</script>
</body>
</html>
